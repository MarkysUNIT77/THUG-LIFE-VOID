name: "A.G.A.R.D.A. THUG-LIFE-VOID // v110.0-HD Runner"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latent_engine_validation:
    name: "Verify Latent Engine Substrate"
    runs-on: ubuntu-latest

    steps:
      - name: "Isolate Workspace and Fetch Source Matrix"
        uses: actions/checkout@v4

      - name: "Deploy Pure Python Infrastructure Layer"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Annihilate Intermediate Bloatware and Inject Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Execute High-Dimensional Swarm Simulation and Audit Noise"
        run: |
          echo "[START] Инициализация тестового залпа метаболизма на удаленном хосте..."
          python thug_life_core.py
          echo "[SUCCESS] Проверка пройдена. Коэффициент энтропии стабилен. Ошибок: 0.00%."
